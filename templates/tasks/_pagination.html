{% if page_obj.paginator.num_pages > 1 %}
    <nav class="mt-3" aria-label="Страницы">
        <ul class="pagination pagination-sm justify-content-center mb-0">
            <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">
                {% if page_obj.has_previous %}
                    <a class="page-link" href="?{{ querystring }}{% if querystring %}&amp;{% endif %}page={{ page_obj.previous_page_number }}">←</a>
                {% else %}
                    <span class="page-link">←</span>
                {% endif %}
            </li>
            <li class="page-item disabled">
                <span class="page-link">{{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
            </li>
            <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">
                {% if page_obj.has_next %}
                    <a class="page-link" href="?{{ querystring }}{% if querystring %}&amp;{% endif %}page={{ page_obj.next_page_number }}">→</a>
                {% else %}
                    <span class="page-link">→</span>
                {% endif %}
            </li>
        </ul>
    </nav>
{% endif %}
