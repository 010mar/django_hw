{% for task in tasks %}
    <div class="form-check task-option py-1">
        <input class="form-check-input" type="radio" name="task"
               id="task-option-{{ task.pk }}" value="{{ task.pk }}"
               {% if selected == task.pk|stringformat:'s' %}checked{% endif %}>
        <label class="form-check-label" for="task-option-{{ task.pk }}">
            <span class="badge bg-light text-dark border me-1">{{ task.task_number|default:'без номера' }}</span>
            <span class="badge bg-secondary me-1">{{ task.type_verbose }}</span>
            <span class="badge bg-warning text-dark me-1">{{ task.difficulty_verbose }}</span>
            {{ task.title }}
        </label>
    </div>
{% empty %}
    <div class="alert alert-secondary mb-0">В этой теме нет доступных задач.</div>
{% endfor %}
