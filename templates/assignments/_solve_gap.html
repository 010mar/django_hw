{% load task_filters %}
<div class="card mb-4">
    <div class="card-body">
        <h6 class="mb-3">Заполните пропуски</h6>
        <form method="post">
            {% csrf_token %}
            <div class="gap-flow text-break">
                {% for item in gap_blocks %}
                    {% if item.block.kind == 'text' %}
                        <span class="js-math">{{ item.block.text|render_block_text }}</span>
                    {% else %}
                        <span class="d-inline-flex align-items-center gap-1 me-2 mb-1">
                            <label class="form-label small text-muted mb-0" for="gap-input-{{ item.number }}">
                                Пропуск {{ item.number }}
                            </label>
                            <input type="text" name="gap_{{ item.number }}" id="gap-input-{{ item.number }}"
                                   class="form-control form-control-sm d-inline-block" style="width:8rem" required
                                   {% if preview %}disabled{% endif %}>
                        </span>
                    {% endif %}
                {% endfor %}
            </div>
            {% if not preview %}
                <button type="submit" class="btn btn-primary mt-3">Отправить</button>
            {% endif %}
        </form>
    </div>
</div>
