{% extends 'base.html' %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h4 mb-3">Проверьте почту</h1>
                <p class="mb-2">
                    Если аккаунт с таким адресом существует, мы отправили на него письмо со ссылкой для сброса пароля.
                </p>
                <p class="text-muted mb-0">
                    Если письма нет, проверьте папку «Спам». Ссылка действует 3 дня.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
