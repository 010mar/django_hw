{% extends 'base.html' %}

{% block title %}Выход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h4 mb-3">Выход из аккаунта</h1>
                <p class="text-muted mb-4">Вы действительно хотите выйти?</p>
                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    {{ redirect_field }}
                    <button type="submit" class="btn btn-danger w-100">Выйти</button>
                </form>
                <a href="{% url 'home' %}" class="btn btn-link mt-2">Отмена</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
